model:
  type: random_forest
  n_estimators: 100
  max_depth: 5
  min_samples_split: 2
  random_state: 42

training:
  test_size: 0.2
  random_state: 42
  stratify: true

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: breast_cancer_random_forest
  registered_model_name: BreastCancerClassifier
  autolog: true

data:
  dataset: breast_cancer
  dataset_csv: data/dataset.csv
  target_column: target

paths:
  raw_data: data/raw/
  processed_data: data/processed/
  models: models/
  reports: reports/